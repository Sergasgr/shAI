[project]
name = "shai"
version = "2.0.0"
description = "Autonomous AI terminal agent with DevSecOps, Hybrid RAG, and an End-to-End local MLOps pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "datasets>=4.8.5",
    "httpx>=0.28.1",
    "langchain>=1.2.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "optimum>=2.1.0",
    "peft>=0.19.1",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "transformers>=5.6.0",
    "trl>=1.3.0",
    "typer>=0.24.1",
    "rich>=13.0.0",
    "shellingham>=1.5.4",
    "pathlib>=1.0.1",
    "shellcheck-py>=0.11.0.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.3",
    "prometheus-client>=0.26.0",
    "rank-bm25>=0.2.2",
    "textual>=8.2.8",
    "pytest>=9.1.1",
    "langchain-classic>=1.0.4",
]

[project.scripts]
shai = "shai.cli:t"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
shai = ["data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
