version: '3.8'

services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn controller:app --host 0.0.0.0 --port 8000
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus